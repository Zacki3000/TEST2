name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Force Large Partition Layout
        run: |
          # Wir schalten die Standardtabelle hart auf die große 3MB-Tabelle um
          sed -i 's/CONFIG_PARTITION_TABLE_SINGLE_APP=y/CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE=y/g' sdkconfig
          sed -i 's/CONFIG_PARTITION_TABLE_FILENAME="partitions_singleapp.csv"/CONFIG_PARTITION_TABLE_FILENAME="partitions_singleapp_large.csv"/g' sdkconfig
      - name: Build Project
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c5
          idf.py fullclean
          idf.py build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-n4-no-psram
          path: build/its-g5-receiver-firmware.bin
