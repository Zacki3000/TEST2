name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Create Force Config Defaults
        run: |
          # Wir erzeugen eine unüberschreibbare Standardkonfiguration für die Partitionsgröße
          echo 'CONFIG_PARTITION_TABLE_SINGLE_APP=n' > sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE=y' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_FILENAME="partitions_singleapp_large.csv"' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_CUSTOM=n' >> sdkconfig.defaults
      - name: Build Project
        run: |
          . $IDF_PATH/export.sh
          # Wir löschen alle alten Cache-Dateien vollständig
          rm -rf build sdkconfig
          idf.py set-target esp32c5
          # Wir bauen frisch und binden unsere Defaults-Datei fest ein
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults" build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-n4-no-psram
          path: build/its-g5-receiver-firmware.bin
