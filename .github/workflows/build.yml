name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Build Project
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c5
          idf.py build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-n4-no-psram
          path: build/its-g5-receiver-firmware.bin
